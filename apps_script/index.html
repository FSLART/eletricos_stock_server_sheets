<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gaveta · Gestão de stock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Variaveis, tipografia e estilos base da aplicacao. */
:root{--bg:#E8EDF1;--panel:#fff;--ink:#13202C;--muted:#5E6E7C;--line:#D3DCE3;--accent:#2B4BFF;--accent-soft:#E3E8FF;--warn:#B84A0B;--warn-soft:#FFEBDB;--side:#13202C;
--head:'Bricolage Grotesque','Segoe UI',sans-serif;--body:'DM Sans','Segoe UI',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:15px/1.45 var(--body);background:var(--bg);color:var(--ink);display:grid;grid-template-columns:270px 1fr}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* barra lateral */
aside{background:var(--side);color:#E8EDF1;padding:28px 18px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font:800 26px var(--head);letter-spacing:-.02em;padding:0 10px}
.logo small{display:block;font:400 13px var(--body);color:#8FA1B2;letter-spacing:0;margin-top:2px}
nav{display:flex;flex-direction:column;gap:2px}
nav button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;color:inherit;text-align:left;padding:10px;border-radius:10px}
nav button:hover{background:#ffffff14}
nav button[aria-current=true]{background:var(--accent);color:#fff}
nav .n{font-size:13px;opacity:.7;font-variant-numeric:tabular-nums}
.side-btn{margin-top:auto;background:none;border:1px dashed #5A6D7E;color:#C5D0DA;padding:11px;border-radius:10px}
.side-btn:hover{border-color:#fff;color:#fff}
.cat-row{display:flex;align-items:center;gap:2px}
.cat-row button[data-c]{flex:1;min-width:0}
.cat-del{flex:none;width:28px;height:28px;border-radius:8px;background:none;border:0;color:#C5D0DA;font-size:13px;opacity:0;display:flex;align-items:center;justify-content:center;padding:0}
.cat-row:hover .cat-del,.cat-del:focus-visible{opacity:1}
.cat-del:hover{background:#ffffff22;color:#fff}

/* principal */
main{padding:32px clamp(18px,4vw,48px);display:flex;flex-direction:column;gap:22px;min-width:0}
.top{display:flex;gap:12px;flex-wrap:wrap}
.search{flex:1;min-width:240px;position:relative}
.search input{width:100%;padding:16px 18px 16px 50px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel);font-size:17px}
.search input:focus{border-color:var(--accent);outline:0;box-shadow:0 0 0 4px var(--accent-soft)}
.search svg{position:absolute;left:18px;top:50%;translate:0 -50%;width:20px;color:var(--muted)}
.primary{background:var(--accent);color:#fff;border:0;border-radius:14px;padding:0 24px;font-weight:600;min-height:52px}
.primary:hover{filter:brightness(1.1)}
.heading{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
h1{font:800 34px var(--head);letter-spacing:-.025em}
.sub{color:var(--muted)}

/* marca de agua */
.watermark {
  position: fixed;
  bottom: 24px;
  right: 24px;
  width: 180px;
  height: auto;
  opacity: 0.45;
  pointer-events: none;
  z-index: 9999;
  user-select: none;
}

/* Lista de referencias e controlos de quantidade. */
.list{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.row{display:grid;grid-template-columns:96px 150px minmax(0,1fr) auto auto;gap:18px;align-items:center;padding:14px 20px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row:hover{background:#F7F9FB}
.val{font:700 20px var(--head);letter-spacing:-.01em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:5px}
.chip{background:var(--bg);border-radius:8px;padding:2px 9px;font-size:13px}
.chip b{font-weight:500;color:var(--muted);margin-right:5px}
.item-image{width:80px;height:80px;object-fit:contain;border:1px solid var(--line);border-radius:10px;background:#fff;justify-self:center}
.qty{display:flex;align-items:center;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.qty button{min-width:32px;height:32px;padding:0 6px;border:0;border-radius:9px;background:#fff;font-size:13px;font-weight:700;line-height:1}
.qty button:hover{background:var(--accent);color:#fff}
.qty button.step-one{font-size:18px;font-weight:400}
.qty output{min-width:52px;text-align:center;font:700 18px var(--head);font-variant-numeric:tabular-nums}
.low output{color:var(--warn)}
.tag{font-size:12px;background:var(--warn-soft);color:var(--warn);padding:2px 8px;border-radius:99px;margin-left:8px;font-weight:600}
.del{background:none;border:0;color:var(--muted);width:34px;height:34px;border-radius:9px;font-size:18px}
.del:hover{background:var(--warn-soft);color:var(--warn)}
.empty{padding:56px 20px;text-align:center;color:var(--muted)}

/* indicador de categoria */
.pill{justify-self:start;display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:4px 12px 4px 10px;border-radius:99px;background:var(--bg);white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
nav .dot{margin-right:9px}

/* Dialogos para movimentos de stock e novas categorias. */
dialog{border:0;border-radius:20px;padding:0;width:min(460px,92vw);box-shadow:0 30px 80px #13202C55;margin:auto}
dialog::backdrop{background:#13202C99}
form{padding:26px;display:flex;flex-direction:column;gap:14px}
form h2{font:800 24px var(--head);letter-spacing:-.02em}
label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label input,label select{padding:11px 13px;border:1.5px solid var(--line);border-radius:10px;background:#fff;font-weight:400;color:var(--ink);font-size:15px}
label input:focus,label select:focus{border-color:var(--accent);outline:0}
.check{flex-direction:row;align-items:center;gap:9px}
.check input{width:17px;height:17px;padding:0;accent-color:var(--accent)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);box-shadow:0 1px 3px #0002}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
.ghost{background:none;border:0;padding:0 16px;color:var(--muted);font-weight:600}
.hint{font-size:13px;color:var(--muted)}
.hint.error{color:var(--warn);font-weight:600}

#toast{position:fixed;bottom:24px;left:50%;translate:-50% 0;background:var(--ink);color:#fff;padding:12px 20px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}

@media(max-width:820px){
 body{grid-template-columns:1fr}
 aside{position:static;height:auto;padding:18px}
 nav{flex-direction:row;flex-wrap:wrap}
 .side-btn{margin:0}
 .row{grid-template-columns:80px 1fr;gap:10px 12px;padding:12px 14px}
 .item-image{grid-column:1;grid-row:1}
 .pill{grid-column:2;grid-row:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
 .row>div:nth-of-type(1){grid-column:1/3;grid-row:2}
 .del{grid-column:2;grid-row:2}
 .qty{grid-column:1/3;grid-row:3}
 .watermark{width:130px;bottom:16px;right:16px;}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<aside>
  <div class="logo">Gaveta<small>Stock de componentes</small></div>
  <nav id="cats" aria-label="Categorias"></nav>
  <button class="side-btn" id="newCat">+ Nova categoria</button>
</aside>

<main>
  <div class="top">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Pesquisar por valor, tamanho, categoria…" autocomplete="off">
    </div>
    <button class="primary" id="addBtn">Adicionar / retirar</button>
  </div>

  <div class="heading">
    <h1 id="title">Tudo</h1>
    <span class="sub" id="stats"></span>
  </div>

  <div class="list" id="list"></div>
</main>

<!-- Entrada / saída de stock -->
<dialog id="dlgItem">
  <form method="dialog" id="fItem">
    <h2>Movimento de stock</h2>
    <div class="seg" role="group">
      <button type="button" data-mode="in" aria-pressed="true">Entrada</button>
      <button type="button" data-mode="out" aria-pressed="false">Saída</button>
    </div>
    <label>Categoria <select id="fCat"></select></label>
    <div class="fields" id="fProps"></div>
    <label id="fImageWrap" hidden>Imagem <input id="fImage" type="file" accept="image/png,image/jpeg,image/gif,image/webp"></label>
    <label>Quantidade <input id="fQty" type="number" min="1" value="1" required></label>
    <p class="hint" id="fHint">Se já existir um item com as mesmas propriedades, a quantidade é somada.</p>
    <div class="actions">
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button class="primary" id="fGo">Adicionar ao stock</button>
    </div>
  </form>
</dialog>

<!-- Nova categoria -->
<dialog id="dlgCat">
  <form method="dialog" id="fCatForm">
    <h2>Nova categoria</h2>
    <label>Nome <input id="cName" placeholder="Ex.: Díodos" required></label>
    <label>Propriedades (separadas por vírgula) <input id="cProps" placeholder="Ex.: tipo, tensão, corrente" required></label>
    <label class="check"><input id="cImage" type="checkbox"> Permitir uma imagem por componente</label>
    <p class="hint">Itens com todas as propriedades iguais ficam agrupados e a quantidade soma.</p>
    <div class="actions">
      <button type="button" class="ghost" data-close>Cancelar</button>
      <button class="primary">Criar categoria</button>
    </div>
  </form>
</dialog>

<div id="toast" role="status"></div>

<script>
// Estado local da interface; o servidor continua a ser a fonte sincronizada.
let categories = [], items = [], current = null, mode = 'in', dataSignature = '';
const LOW = 5;

const $ = s => document.querySelector(s);
const norm = v => String(v).toLowerCase().replace(/\s+/g,'');

/* indicador de categoria: cor fixa por nome */
const hue = s => [...s].reduce((a,c) => (a*31 + c.charCodeAt(0)) % 360, 7);
const dot = c => `<i class="dot" style="background:hsl(${hue(c)} 65% 48%)"></i>`;
const part = it => `<span class="pill">${dot(it.cat)}${it.cat}</span>`;

/* título do item: valor / capacidade / primeira propriedade */
function mainValue(it){
  const p = it.props, k = Object.keys(p);
  return p.valor || p.capacidade || p[k[0]] || '—';
}

function render(){
  // Reconstroi apenas a apresentacao atual a partir dos dados em memoria.
  const q = norm($('#q').value);
  const total = c => items.filter(i => !c || i.cat === c).reduce((s,i) => s + i.qty, 0);

  $('#cats').innerHTML =
    `<div class="cat-row"><button data-c="" aria-current="${!current}">Tudo <span class="n">${total()}</span></button></div>` +
    categories.map(c => `
      <div class="cat-row">
        <button data-c="${c.name}" aria-current="${current===c.name}"><span>${dot(c.name)}${c.name}</span> <span class="n">${total(c.name)}</span></button>
        <button class="cat-del" data-delcat="${c.name}" aria-label="Apagar categoria ${c.name}" title="Apagar categoria">✕</button>
      </div>`).join('');

  const shown = items.filter(i =>
    (!current || i.cat === current) &&
    (!q || norm(i.cat + Object.values(i.props).join('')).includes(q)));

  $('#title').textContent = current || 'Tudo';
  $('#stats').textContent = `${shown.length} referências · ${shown.reduce((s,i)=>s+i.qty,0)} unidades`;

  $('#list').innerHTML = shown.length ? shown.map(it => `
    <div class="row ${it.qty <= LOW ? 'low' : ''}">
      ${part(it)}
      ${it.image ? `<img class="item-image" src="${it.image}" alt="Imagem de ${it.cat}">` : '<span></span>'}
      <div>
        <div><span class="val">${mainValue(it)}</span>${it.qty<=LOW?'<span class="tag">pouco stock</span>':''}</div>
        <div class="chips">${Object.entries(it.props).map(([k,v]) => `<span class="chip"><b>${k}</b>${v}</span>`).join('')}</div>
      </div>
      <div class="qty">
        <button data-step="-10" data-id="${it.id}" aria-label="Retirar 10">−10</button>
        <button class="step-one" data-step="-1" data-id="${it.id}" aria-label="Retirar 1">−</button>
        <output>${it.qty}</output>
        <button class="step-one" data-step="1" data-id="${it.id}" aria-label="Adicionar 1">+</button>
        <button data-step="10" data-id="${it.id}" aria-label="Adicionar 10">+10</button>
      </div>
      <button class="del" data-del="${it.id}" aria-label="Apagar item" title="Apagar item">✕</button>
    </div>`).join('')
    : `<div class="empty"><b>Nada encontrado.</b><br>Tenta outra pesquisa ou adiciona um item novo.</div>`;
}

/* ações */
function toast(t){ const el=$('#toast'); el.textContent=t; el.classList.add('on'); clearTimeout(el.t); el.t=setTimeout(()=>el.classList.remove('on'),2400); }

const PENDING_KEY = 'stock.pending.v1';
const DATA_KEY = 'stock.data.v1';
let syncing = false;

// O iframe do Apps Script pode ter o localStorage bloqueado; a app funciona sem ele.
function storeGet(key){ try{ return localStorage.getItem(key); }catch{ return null; } }
function storeSet(key, value){ try{ localStorage.setItem(key, value); }catch{} }

function pendingRequests(){
  try{ return JSON.parse(storeGet(PENDING_KEY) || '[]'); }
  catch{ return []; }
}
function savePending(requests){ storeSet(PENDING_KEY, JSON.stringify(requests)); }

function call(action, payload){
  // Chama api() no Code.gs.
  return new Promise((resolve, reject) => google.script.run
    .withSuccessHandler(resolve)
    .withFailureHandler(reject)
    .api(action, payload || {}));
}

async function api(action, payload){
  // Escritas feitas sem rede ficam guardadas e sao reenviadas quando a ligacao volta.
  if(action !== 'data' && !navigator.onLine){
    const requests = pendingRequests();
    requests.push({action, payload: payload || null});
    savePending(requests);
    return {queued:true, msg:'Sem ligação. Operação guardada e será sincronizada quando o servidor voltar.'};
  }
  return call(action, payload);
}
async function load(){
  // Le o estado atual diretamente da Google Sheet.
  try{
    const d = await api('data');
    const nextSignature = JSON.stringify([d.categories, d.items]);
    categories = d.categories; items = d.items;
    storeSet(DATA_KEY, JSON.stringify(d));
    if(nextSignature !== dataSignature){
      dataSignature = nextSignature;
      render();
    }
  }catch(error){
    const cached = storeGet(DATA_KEY);
    if(!cached) throw error;
    const d = JSON.parse(cached);
    const nextSignature = JSON.stringify([d.categories, d.items]);
    categories = d.categories; items = d.items;
    if(nextSignature !== dataSignature){
      dataSignature = nextSignature;
      render();
    }
  }
}
function formError(message){
  const hint = $('#fHint');
  hint.textContent = message;
  hint.classList.add('error');
}
async function apagarCategoria(name){
  try{
    const d = await api('deleteCategory', {name});
    if(current === name) current = null;
    toast(d.msg);
    await load();
  }catch(err){ toast(err.message); }
}
let syncingChanges = 0;
// Impede alteracoes destrutivas enquanto uma escrita esta em andamento.
async function act(fn){
  syncingChanges++;
  toast('A sincronizar...');
  try{
    const result = await fn();
    if(result && result.queued) toast(result.msg);
    else await load();
  }catch(e){ toast(e.message); }
  finally{ syncingChanges--; }
}

const stepQueues = new Map();
// Acumula cliques por item e envia um delta total, evitando pedidos concorrentes.
async function processStepQueue(id){
  const queue = stepQueues.get(id);
  if(!queue || queue.running) return;
  queue.running = true;
  syncingChanges++;
  toast('A sincronizar...');
  try{
    while(queue.pendingDelta){
      const delta = queue.pendingDelta;
      queue.pendingDelta = 0;
      try{
        const result = await api('step', {id: Number(id), delta});
        if(result && result.queued) toast(result.msg);
      }catch(error){
        const item = items.find(current => current.id === Number(id));
        if(item) item.qty = Math.max(0, item.qty - delta);
        render();
        toast(error.message);
      }
    }
  }finally{
    syncingChanges--;
    queue.running = false;
    stepQueues.delete(id);
  }
}

function stepItem(id, delta){
  // Atualiza o ecran de imediato e coloca a variacao na fila desse item.
  const item = items.find(current => current.id === Number(id));
  if(!item) return;
  item.qty = Math.max(0, item.qty + delta);
  render();
  const queue = stepQueues.get(id) || {pendingDelta: 0, running: false, timer: null};
  queue.pendingDelta += delta;
  stepQueues.set(id, queue);
  if(!queue.running && !queue.timer){
    queue.timer = setTimeout(() => {
      queue.timer = null;
      processStepQueue(id);
    }, 150);
  }
}

async function syncPending(){
  // Tenta reenviar operacoes que foram guardadas durante uma falha de rede.
  if(syncing || !navigator.onLine) return;
  syncing = true;
  let synced = 0;
  try{
    const requests = pendingRequests();
    while(requests.length){
      const pending = requests[0];
      try{
        await call(pending.action, pending.payload);
        synced++;
      }catch(error){
        if(!navigator.onLine) break;
        toast(error.message || 'Uma operação offline não foi aceite pelo servidor');
      }
      requests.shift();
      savePending(requests);
    }
  }finally{
    syncing = false;
  }
  if(synced){
    await load();
    toast(`${synced} operação(ões) sincronizada(s)`);
  }
}

window.addEventListener('online', syncPending);

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  if(syncingChanges && b.dataset.close === undefined && b.dataset.mode === undefined && !(b.dataset.step && stepQueues.size)){
    toast('A sincronizar...');
    return;
  }
  if(b.dataset.c !== undefined && b.closest('#cats')){ current = b.dataset.c || null; render(); }
  if(b.dataset.step) stepItem(b.dataset.id, +b.dataset.step);
  if(b.dataset.del && confirm('Apagar este item do stock?')) act(() => api('deleteItem', {id: Number(b.dataset.del)}));
  if(b.dataset.delcat){
    const refs = items.filter(i => i.cat === b.dataset.delcat);
    const qty = refs.reduce((s,i) => s + i.qty, 0);
    const aviso = refs.length
      ? `Apagar a categoria "${b.dataset.delcat}"?\n\nIsto vai apagar também ${refs.length} referência(s) (${qty} unidades) que estão lá dentro. Esta ação não pode ser desfeita.`
      : `Apagar a categoria "${b.dataset.delcat}"?\n\nEsta ação não pode ser desfeita.`;
    if(confirm(aviso)) apagarCategoria(b.dataset.delcat);
  }
  if(b.dataset.close !== undefined) b.closest('dialog').close();
  if(b.dataset.mode){ setMode(b.dataset.mode); }
});
$('#q').addEventListener('input', render);

/* diálogo de movimento */
function setMode(m){
  mode = m;
  document.querySelectorAll('.seg button').forEach(x => x.setAttribute('aria-pressed', x.dataset.mode === m));
  $('#fGo').textContent = m === 'in' ? 'Adicionar ao stock' : 'Retirar do stock';
  $('#fHint').textContent = m === 'in'
    ? 'Se já existir um item com as mesmas propriedades, a quantidade é somada.'
    : 'Preenche as propriedades do item de onde queres retirar.';
  $('#fHint').classList.remove('error');
}
function buildFields(){
  const c = categories.find(c => c.name === $('#fCat').value);
  $('#fProps').innerHTML = c.props.map((p,i) => {
    const opts = [...new Set(items.filter(it => it.cat === c.name).map(it => it.props[p]).filter(Boolean))];
    return `<label>${p}<input data-prop name="${p}" list="dl${i}" required autocomplete="off"><datalist id="dl${i}">${opts.map(o=>`<option value="${o}">`).join('')}</datalist></label>`;
  }).join('');
  $('#fImageWrap').hidden = !c.image;
  $('#fImage').value = '';
}
$('#addBtn').onclick = () => {
  if(syncingChanges){ toast('A sincronizar...'); return; }
  $('#fCat').innerHTML = categories.map(c => `<option ${c.name===current?'selected':''}>${c.name}</option>`).join('');
  buildFields(); setMode('in'); $('#fQty').value = 1; $('#dlgItem').showModal();
};
$('#fCat').onchange = buildFields;
let refreshing = false;
async function refreshFromServer(){
  // Atualiza a interface sem interferir com uma fila de alteracoes ativa.
  if(refreshing || syncingChanges || stepQueues.size || document.visibilityState !== 'visible') return;
  refreshing = true;
  try{ await load(); }
  catch{ /* Mantem os dados locais quando o servidor fica indisponivel. */ }
  finally{ refreshing = false; }
}

setInterval(refreshFromServer, 15000);

// Normaliza no browser para JPEG 800x800 com fundo branco (antes era o Pillow no Flask).
async function jpegBase64(file){
  let bitmap;
  try{ bitmap = await createImageBitmap(file, {imageOrientation: 'from-image'}); }
  catch{ throw new Error('O ficheiro enviado não é uma imagem válida'); }
  const size = 800, canvas = document.createElement('canvas');
  canvas.width = canvas.height = size;
  const ctx = canvas.getContext('2d');
  const scale = Math.min(size / bitmap.width, size / bitmap.height);
  const w = bitmap.width * scale, h = bitmap.height * scale;
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, size, size);
  ctx.drawImage(bitmap, (size - w) / 2, (size - h) / 2, w, h);
  return canvas.toDataURL('image/jpeg', 0.88).split(',')[1];
}
$('#fItem').addEventListener('submit', async e => {
  e.preventDefault();
  if(syncingChanges){ toast('A sincronizar...'); return; }
  const props = {};
  document.querySelectorAll('#fProps input[data-prop]').forEach(i => props[i.name] = i.value.trim());
  try{
    let image = '';
    const file = $('#fImage').files[0];
    if(file) image = (await call('uploadImage', {data: await jpegBase64(file)})).url;
    const d = await api('move', {cat: $('#fCat').value, props, qty: +$('#fQty').value, mode, image});
    toast(d.msg); $('#dlgItem').close(); if(!d.queued) await load();
  }catch(err){ formError(err.message); }
});

/* nova categoria */
$('#newCat').onclick = () => { $('#fCatForm').reset(); $('#dlgCat').showModal(); };
$('#fCatForm').addEventListener('submit', async e => {
  e.preventDefault();
  const name = $('#cName').value.trim();
  const props = $('#cProps').value.split(',').map(s => s.trim()).filter(Boolean);
  try{
    const d = await api('newCategory', {name, props, image: $('#cImage').checked});
    $('#dlgCat').close(); current = name; toast(d.msg); await load();
  }catch(err){ toast(err.message); }
});

syncPending();
load().catch(error => toast(error.message || 'Sem ligação ao servidor e sem dados guardados neste dispositivo'));
</script>
